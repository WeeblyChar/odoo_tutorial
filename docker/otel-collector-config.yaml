receivers:
  otlp: # <--- Receives Data from specified endpoints
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317" # <--- gRPC port
      http:
        endpoint: "0.0.0.0:4318" # <--- HTTP port
  prometheus:
    config:
      scrape_configs:
        - job_name: 'odoo'
          scrape_interval: 5s # <-- Delay between scrape jobs
          static_configs:
            - targets: ['odoo:8069']  # <-- Odoo port to listen
          metrics_path: '/metrics'    # <-- Path for prometheus to scrap from


processors:
  batch:

# Keep in mind that Batch Processor is still in BETA phase.
# "The batch processor accepts spans, metrics, or logs and places them into batches.
# Batching helps better compress the data and reduce the number of outgoing connections required to transmit the data.
# This processor supports both size and time based batching."
# Source: https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/batchprocessor/README.md
          
exporters:
  prometheus:
    endpoint: "0.0.0.0:9464" # <-- Prometheus endpoint, where will the metrics be exported to.
  debug:
    verbosity: normal # <-- Prints the logs into OTel Collector logs. Just for checking if it's recieving logs.
  otlp:
    endpoint: "tempo:4317"  # <-- Trace endpoint for Tempo
    tls:
      insecure: true # <-- Change if needed
  otlphttp: 
    endpoint: "http://loki:3100/otlp" # <-- Logs endpoint for Loki
    tls:
      insecure: true # <-- Change if needed

service:
  pipelines:
    logs: # <-- Send to Loki
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    traces: # <-- Send to Tempo
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp, debug]
    metrics: # <-- Send to Prometheus
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [prometheus]