receivers:
  filelog:
    include: [ "/var/lib/docker/containers/*/*.log" ]
    start_at: beginning

exporters:
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [filelog]
      exporters: [loki]
      
    traces:
      receivers: [otlp]
      exporters: [otlp]