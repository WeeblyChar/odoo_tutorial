receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317" # <--- Spans and Metrics
      http:
        endpoint: "0.0.0.0:4318" # <--- Alternative HTTP receiver

exporters:
  otlp:
    endpoint: "0.0.0.0:4317"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:9464"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp]

    metrics:
      receivers: [otlp]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      exporters: [otlp]
