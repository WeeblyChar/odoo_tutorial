receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
  prometheus:
    config:
      scrape_configs:
        - job_name: 'odoo'
          scrape_interval: 5s
          static_configs:
            - targets: ['odoo:8069']
          metrics_path: '/metrics'

processors:
  batch:
          
exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
  debug:
    verbosity: normal
  otlp:
    endpoint: "tempo:4317"
    tls:
      insecure: true
  otlphttp: 
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus]