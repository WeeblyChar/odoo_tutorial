services:
  odoo:
    build: .
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - C:\Users\LEGION\odoo\docker\odoo.conf:/etc/odoo/odoo.conf
      - C:\Users\LEGION\odoo\addons:/mnt/extra-addons
      - C:\Users\LEGION\odoo\tutorials:/mnt/tutorial-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PGDATABASE=odoo  # Ensures fresh DB each time
      - --db-filter=^odoo$  # Restricts to only "odoo" DB

  db:
    image: postgres:17
    container_name: odoo-db
    environment:
      - POSTGRES_DB=practice_database
      - POSTGRES_USER=Odoo_Practice
      - POSTGRES_PASSWORD=1231
    volumes:
      - db-data:/var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose PostgreSQL to the host machine
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    restart: unless-stopped
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"  # gRPC
      - "4318:4318"  # HTTP
      - "9464:9464"  # Prometheus Metrics

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  db-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs  # This resets the database on each restart