services:
  odoo:
    build: .
    container_name: odoo
    depends_on:
      - db
      - otel-collector
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
    networks:
      - monitoring
      - odoo_network

  db:
    image: postgres:15
    container_name: odoo-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - odoo_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    volumes:
      - ./tempo.yml:/etc/tempo.yml  # Mount config
      - tempo_data:/tmp/tempo  # Persistent storage
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
      - "9095:9095"
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - loki_data:/var/loki
    ports:
      - "3100:3100"  # Loki API
    networks:
      - monitoring

volumes:
  db_data:
  grafana_data:
  tempo_data:
  loki_data:

networks:
  monitoring:
  odoo_network: